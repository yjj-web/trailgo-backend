databases:
  - name: trailgo-db
    plan: free
    databaseName: trailgo
    user: trailgo

services:
  - type: web
    name: trailgo-backend
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/trails
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: trailgo-db
          property: connectionString
