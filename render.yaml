databases:
  - name: trailgo-db
    plan: free
    databaseName: trailgo
    user: trailgo

services:
  - type: web
    name: trailgo-backend
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/trails
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: trailgo-db
          property: connectionString
      # JWT 签名密钥，Render 自动生成并固定（用于用户登录 token）
      - key: JWT_SECRET
        generateValue: true
